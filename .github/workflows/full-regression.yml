name: Annotated Full Regression

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

concurrency:
  group: annotated-full-regression-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  full-regression:
    if: contains(github.event.pull_request.title, '[phase-gate]')
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: annotated_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    strategy:
      matrix:
        php-version: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo_mysql, mbstring, curl, dom, openssl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Extension JavaScript syntax
        run: find extension assets/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Complete historical regression
        env:
          DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=annotated_test;charset=utf8mb4
          DB_USER: root
          DB_PASS: root
        run: bash tests/ci/run-full-regression.sh
      - name: Upgrade rehearsal from migration 056 through 059
        env:
          DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=annotated_phase60_upgrade;charset=utf8mb4
          DB_USER: root
          DB_PASS: root
          PHASE60_RESET_DB: '1'
        run: php tests/ci/phase60-upgrade-from-056.php
      - name: Phase 61 upgrade rehearsal from migration 058 through 059
        env:
          DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=annotated_phase61_upgrade;charset=utf8mb4
          DB_USER: root
          DB_PASS: root
          PHASE61_RESET_DB: '1'
        run: php tests/ci/phase61-upgrade-from-058.php
      - name: Phase 62 supported baseline upgrade and repeat-safety rehearsal
        env:
          DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=annotated_phase62_upgrade;charset=utf8mb4
          DB_USER: root
          DB_PASS: root
          PHASE62_RESET_DBS: '1'
        run: php tests/ci/phase62-upgrade-supported-baselines.php
      - name: Phase 63 upgrade rehearsal from migration 059 through current
        env:
          DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=annotated_phase63_upgrade;charset=utf8mb4
          DB_USER: root
          DB_PASS: root
          PHASE63_RESET_DB: '1'
        run: php tests/ci/phase63-upgrade-from-059.php
      - name: Profile Phase 2 upgrade rehearsal from migration 060 through current
        env:
          DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=annotated_profile_phase2_upgrade;charset=utf8mb4
          DB_USER: root
          DB_PASS: root
          PROFILE_PHASE2_RESET_DB: '1'
        run: php tests/ci/profile-phase2-upgrade-from-060.php
      - name: Subscriptions V1 upgrade rehearsal from migration 061 through current
        env:
          DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=annotated_subscriptions_v1_upgrade;charset=utf8mb4
          DB_USER: root
          DB_PASS: root
          SUBSCRIPTIONS_V1_RESET_DB: '1'
        run: php tests/ci/subscriptions-v1-upgrade-from-061.php
      - name: Admin V1.10 AI usage upgrade rehearsal from migration 062 through current
        env:
          DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=annotated_ai_usage_v1_upgrade;charset=utf8mb4
          DB_USER: root
          DB_PASS: root
          AI_USAGE_V1_RESET_DB: '1'
        run: php tests/ci/ai-usage-v1-upgrade-from-062.php
      - name: Admin V1.30 upgrade rehearsal from migration 063 through current
        env:
          DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=annotated_admin_v130_upgrade;charset=utf8mb4
          DB_USER: root
          DB_PASS: root
          ADMIN_V130_RESET_DB: '1'
        run: php tests/ci/admin-v1-30-upgrade-from-063.php
      - name: Admin V1.40 Stripe billing upgrade rehearsal from migration 064 through 065
        env:
          DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=annotated_admin_v140_upgrade;charset=utf8mb4
          DB_USER: root
          DB_PASS: root
          ADMIN_V140_RESET_DB: '1'
        run: php tests/ci/admin-v1-40-upgrade-from-064.php
      - name: Code audit hardening upgrade rehearsal from migration 065 through 066
        env:
          DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=annotated_code_audit_upgrade;charset=utf8mb4
          DB_USER: root
          DB_PASS: root
          CODE_AUDIT_RESET_DB: '1'
        run: php tests/ci/code-audit-upgrade-from-065.php

  mysql8-fresh-install:
    if: contains(github.event.pull_request.title, '[phase-gate]')
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: annotated_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, curl, dom, openssl
          coverage: none
      - name: PHP syntax
        run: php -l app/migrations.php && php -l app/installer.php && php -l install.php
      - name: Fresh install MySQL 8 compatibility suite
        env:
          DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=annotated_test;charset=utf8mb4
          DB_USER: root
          DB_PASS: root
        run: |
          php tests/install-db.php
          php tests/ci/prepare-current-schema.php
          php tests/phase12b-agent-chat-db.php
          php tests/phase16-cognitive-feed-db.php
          php tests/phase17-proactive-intelligence-db.php
          php tests/home-cognitive-mysql8-db.php
          php tests/research-library-db.php
          php tests/phase60-research-intelligence-portfolios-db.php
          php tests/phase61-portfolio-intelligence-operations-db.php
          php tests/phase62-v1-1-final-release-db.php
          php tests/phase62-v1-1-soak-db.php
          php tests/phase63-vp3-connection-db.php
          php tests/profile-phase2-showcase-db.php
          php tests/profile-phase3-research-network-db.php
          php tests/admin-subscriptions-packages-v1-db.php
          php tests/admin-ai-usage-v1-db.php
          php tests/admin-v1-30-account-lifecycle-db.php
          php tests/admin-v1-40-stripe-billing-db.php
          php tests/code-audit-hardening-db.php
      - name: MySQL 8 upgrade rehearsal from migration 056 through 059
        env:
          DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=annotated_phase60_upgrade;charset=utf8mb4
          DB_USER: root
          DB_PASS: root
          PHASE60_RESET_DB: '1'
        run: php tests/ci/phase60-upgrade-from-056.php
      - name: MySQL 8 Phase 61 upgrade rehearsal from migration 058 through 059
        env:
          DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=annotated_phase61_upgrade;charset=utf8mb4
          DB_USER: root
          DB_PASS: root
          PHASE61_RESET_DB: '1'
        run: php tests/ci/phase61-upgrade-from-058.php
      - name: MySQL 8 Phase 62 supported baseline upgrade and repeat-safety rehearsal
        env:
          DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=annotated_phase62_upgrade;charset=utf8mb4
          DB_USER: root
          DB_PASS: root
          PHASE62_RESET_DBS: '1'
        run: php tests/ci/phase62-upgrade-supported-baselines.php
      - name: MySQL 8 Phase 63 upgrade rehearsal from migration 059 through current
        env:
          DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=annotated_phase63_upgrade;charset=utf8mb4
          DB_USER: root
          DB_PASS: root
          PHASE63_RESET_DB: '1'
        run: php tests/ci/phase63-upgrade-from-059.php
      - name: MySQL 8 Profile Phase 2 upgrade rehearsal from migration 060 through current
        env:
          DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=annotated_profile_phase2_upgrade;charset=utf8mb4
          DB_USER: root
          DB_PASS: root
          PROFILE_PHASE2_RESET_DB: '1'
        run: php tests/ci/profile-phase2-upgrade-from-060.php
      - name: MySQL 8 Subscriptions V1 upgrade rehearsal from migration 061 through current
        env:
          DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=annotated_subscriptions_v1_upgrade;charset=utf8mb4
          DB_USER: root
          DB_PASS: root
          SUBSCRIPTIONS_V1_RESET_DB: '1'
        run: php tests/ci/subscriptions-v1-upgrade-from-061.php
      - name: MySQL 8 Admin V1.10 AI usage upgrade rehearsal from migration 062 through current
        env:
          DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=annotated_ai_usage_v1_upgrade;charset=utf8mb4
          DB_USER: root
          DB_PASS: root
          AI_USAGE_V1_RESET_DB: '1'
        run: php tests/ci/ai-usage-v1-upgrade-from-062.php
      - name: MySQL 8 Admin V1.30 upgrade rehearsal from migration 063 through current
        env:
          DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=annotated_admin_v130_upgrade;charset=utf8mb4
          DB_USER: root
          DB_PASS: root
          ADMIN_V130_RESET_DB: '1'
        run: php tests/ci/admin-v1-30-upgrade-from-063.php
      - name: MySQL 8 Admin V1.40 Stripe billing upgrade rehearsal from migration 064 through 065
        env:
          DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=annotated_admin_v140_upgrade;charset=utf8mb4
          DB_USER: root
          DB_PASS: root
          ADMIN_V140_RESET_DB: '1'
        run: php tests/ci/admin-v1-40-upgrade-from-064.php
      - name: MySQL 8 code audit hardening upgrade rehearsal from migration 065 through 066
        env:
          DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=annotated_code_audit_upgrade;charset=utf8mb4
          DB_USER: root
          DB_PASS: root
          CODE_AUDIT_RESET_DB: '1'
        run: php tests/ci/code-audit-upgrade-from-065.php

  package:
    if: contains(github.event.pull_request.title, '[phase-gate]')
    needs: [full-regression, mysql8-fresh-install]
    uses: ./.github/workflows/package-two-zips.yml
