name: Annotated CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: annotated-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  php-js-contracts:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: annotated_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    strategy:
      matrix:
        php-version: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo_mysql, mbstring, curl, dom, openssl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Extension JavaScript syntax
        run: find extension assets/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Manifest and migration contracts
        run: php tests/release-contracts.php
      - name: Security contracts
        run: php tests/security-contracts.php
      - name: Universal app shell and social product contracts
        run: php tests/app-shell-contracts.php
      - name: Concurrency and migration contracts
        run: php tests/concurrency-contracts.php
      - name: Abuse protection contracts
        run: php tests/rate-limit-contracts.php
      - name: V1.1 RC1 end-to-end release contract
        run: php tests/v1-rc-e2e-contract.php
      - name: Fresh install MariaDB suite
        env:
          DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=annotated_test;charset=utf8mb4
          DB_USER: root
          DB_PASS: root
        run: php tests/install-db.php
      - name: MariaDB integration and security suite
        env:
          DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=annotated_test;charset=utf8mb4
          DB_USER: root
          DB_PASS: root
        run: php tests/integration-mariadb.php
      - name: MariaDB authorization boundary suite
        env:
          DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=annotated_test;charset=utf8mb4
          DB_USER: root
          DB_PASS: root
        run: php tests/integration-security-db.php
      - name: Research knowledge MariaDB suite
        env:
          DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=annotated_test;charset=utf8mb4
          DB_USER: root
          DB_PASS: root
        run: php tests/research-knowledge-db.php
      - name: Research intelligence MariaDB suite
