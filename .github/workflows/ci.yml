name: Annotated CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  php-js-contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Extension JavaScript syntax
        run: find extension -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Manifest and migration contracts
        run: php tests/release-contracts.php
