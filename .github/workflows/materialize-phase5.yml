name: Materialize Phase 5

on:
  push:
    branches: [annotated-v1-1-phase5-rich-capture]

permissions:
  contents: write

concurrency:
  group: materialize-phase5
  cancel-in-progress: false

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: annotated-v1-1-phase5-rich-capture
          fetch-depth: 0
      - name: Reconstruct verified patch
        run: |
          cat phase5-payload.00 phase5-payload.01 phase5-payload.02 phase5-payload.03 phase5-payload.04 phase5-payload.05 phase5-payload.06 phase5-payload.07 phase5-payload.08 | base64 -d | gzip -dc > /tmp/phase5.patch
          sed -e 's#/mnt/data/phase4_compare/#a/#g' -e 's#/mnt/data/phase5_work/#b/#g' /tmp/phase5.patch > /tmp/phase5-normalized.patch
          git apply --check /tmp/phase5-normalized.patch
          git apply /tmp/phase5-normalized.patch
      - name: Remove staging artifacts
        run: |
          rm -f phase5-payload.00 phase5-payload.01 phase5-payload.02 phase5-payload.03 phase5-payload.04 phase5-payload.05 phase5-payload.06 phase5-payload.07 phase5-payload.08
          rm -f .github/workflows/materialize-phase5.yml
      - name: Verify source tree
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/dev/null
          find extension -name '*.js' -print0 | xargs -0 -n1 node --check
          php tests/release-contracts.php
          php tests/security-contracts.php
          php tests/concurrency-contracts.php
          php tests/rate-limit-contracts.php
      - name: Commit Phase 5 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V1.1 Phase 5: Rich Capture"
          git push origin HEAD:annotated-v1-1-phase5-rich-capture
