name: Annotated V1.1 RC Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v1.1.0-rc*'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate RC manifest
        shell: bash
        run: |
          set -euo pipefail
          php -r '$m=json_decode(file_get_contents("extension/manifest.json"),true,512,JSON_THROW_ON_ERROR); if(($m["manifest_version"]??0)!==3||($m["version"]??"")!=="0.9.0") exit(1);'

      - name: Package Chrome extension
        shell: bash
        run: |
          set -euo pipefail
          (cd extension && zip -qr ../Annotated-Chrome-V0.9.0.zip .)
          unzip -t Annotated-Chrome-V0.9.0.zip

      - name: Package server
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .git
          zip -qr Annotated-V1.1-RC1-Server.zip . -x "Annotated-V1.1-RC1-Server.zip" "Annotated-Chrome-V0.9.0.zip" "Annotated-V1.1-RC1.sha256"
          unzip -t Annotated-V1.1-RC1-Server.zip
          sha256sum Annotated-V1.1-RC1-Server.zip Annotated-Chrome-V0.9.0.zip > Annotated-V1.1-RC1.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: annotated-v1-1-rc1
          path: |
            Annotated-V1.1-RC1-Server.zip
            Annotated-Chrome-V0.9.0.zip
            Annotated-V1.1-RC1.sha256
          if-no-files-found: error
