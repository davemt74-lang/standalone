name: Annotated V1 RC1 Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v1.0.0-rc*'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate RC manifest
        shell: bash
        run: |
          set -euo pipefail
          php -r '$m=json_decode(file_get_contents("extension/manifest.json"),true,512,JSON_THROW_ON_ERROR); if(($m["manifest_version"]??0)!==3||($m["version"]??"")!=="0.36.0") exit(1);'

      - name: Package Chrome extension
        shell: bash
        run: |
          set -euo pipefail
          (cd extension && zip -qr ../Annotated-Chrome-Extension.zip .)
          unzip -t Annotated-Chrome-Extension.zip

      - name: Package server
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .git
          zip -qr Annotated-Website.zip . -x "Annotated-Website.zip" "Annotated-Chrome-Extension.zip" "SHA256SUMS.txt"
          unzip -t Annotated-Website.zip
          sha256sum Annotated-Website.zip Annotated-Chrome-Extension.zip > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: annotated-v1-rc1
          path: |
            Annotated-Website.zip
            Annotated-Chrome-Extension.zip
            SHA256SUMS.txt
          if-no-files-found: error
