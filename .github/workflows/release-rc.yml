name: Annotated V1 RC1 Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v1.0.0-rc*'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate RC manifest
        shell: bash
        run: |
          set -euo pipefail
          php -r '$m=json_decode(file_get_contents("extension/manifest.json"),true,512,JSON_THROW_ON_ERROR); if(($m["manifest_version"]??0)!==3||($m["version"]??"")!=="0.36.0") exit(1);'

      - name: Package Chrome extension
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package-website package-extension
          mkdir package-website package-extension
          cp -a extension/. package-extension/
          (cd package-extension && zip -qr ../Annotated-Chrome-Extension.zip .)
          unzip -t Annotated-Chrome-Extension.zip

      - name: Package server
        shell: bash
        run: |
          set -euo pipefail
          rsync -a ./ package-website/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'extension/' \
            --exclude 'package-website/' \
            --exclude 'package-extension/' \
            --exclude 'Annotated-Website.zip' \
            --exclude 'Annotated-Chrome-Extension.zip' \
            --exclude 'SHA256SUMS.txt'
          mkdir -p package-website/downloads
          cp Annotated-Chrome-Extension.zip package-website/downloads/Annotated-Chrome-Extension.zip
          (cd package-website && zip -qr ../Annotated-Website.zip .)
          unzip -t Annotated-Website.zip
          test -f package-website/index.php
          test -f package-website/install.php
          test -f package-website/database/schema.sql
          test -f package-website/downloads/Annotated-Chrome-Extension.zip
          sha256sum Annotated-Website.zip Annotated-Chrome-Extension.zip > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: annotated-v1-rc1
          path: |
            Annotated-Website.zip
            Annotated-Chrome-Extension.zip
            SHA256SUMS.txt
          if-no-files-found: error
