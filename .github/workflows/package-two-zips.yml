name: Annotated Two-Package Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build complete Chrome extension ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package-website package-extension
          mkdir package-website package-extension
          cp -a extension/. package-extension/
          (cd package-extension && zip -qr ../Annotated-Chrome-Extension.zip .)
          unzip -t Annotated-Chrome-Extension.zip
          test -f package-extension/manifest.json
          php -r '$m=json_decode(file_get_contents("package-extension/manifest.json"),true,512,JSON_THROW_ON_ERROR); $v=(string)($m["version"]??""); if(($m["manifest_version"]??0)!==3||!preg_match("/^[0-9]+(?:\.[0-9]+){1,3}$/",$v)) exit(1);'

      - name: Build complete website ZIP
        shell: bash
        run: |
          set -euo pipefail
          rsync -a ./ package-website/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'extension/' \
            --exclude 'package-website/' \
            --exclude 'package-extension/' \
            --exclude 'Annotated-Website.zip' \
            --exclude 'Annotated-Chrome-Extension.zip'
          mkdir -p package-website/downloads package-website/extension
          cp Annotated-Chrome-Extension.zip package-website/downloads/Annotated-Chrome-Extension.zip
          cp extension/manifest.json package-website/extension/manifest.json
          GITHUB_SHA="$GITHUB_SHA" php package-website/bin/release-manifest.php > package-website/RELEASE-MANIFEST.json
          (cd package-website && zip -qr ../Annotated-Website.zip .)
          unzip -t Annotated-Website.zip
          test -f package-website/index.php
          test -f package-website/install.php
          test -f package-website/upgrade.php
          test -f package-website/database/schema.sql
          test -f package-website/database/migrations/20260922_046_model_improvement_campaigns.sql
          test -f package-website/database/migrations/20260922_047_research_agents.sql
          test -f package-website/database/migrations/20260923_048_research_agent_workspace_core.sql
          test -f package-website/database/migrations/20260923_049_research_docs_floating_stickies.sql
          test -f package-website/docs/phase-51-research-docs-floating-stickies.md
          test -f package-website/database/migrations/20260923_050_research_agent_desktop.sql
          test -f package-website/docs/phase-52-research-agent-desktop.md
          test -f package-website/database/migrations/20260923_051_research_desktop_uploads_recordings.sql
          test -f package-website/docs/phase-53-desktop-files-recordings.md
          test -f package-website/api/research-workspace-upload.php
          test -f package-website/research-workspace-file.php
          test -f package-website/worker/research-file-worker.php
          test -f package-website/worker/research-transcription-worker.php
          test -f package-website/database/migrations/20260923_052_unified_research_retrieval.sql
          test -f package-website/docs/phase-54-unified-research-retrieval.md
          test -f package-website/app/research-retrieval.php
          test -f package-website/api/research-retrieval.php
          test -f package-website/worker/research-retrieval-worker.php
          test -f package-website/database/migrations/20260923_053_autonomous_research_workspace.sql
          test -f package-website/docs/phase-55-autonomous-research-workspace.md
          test -f package-website/app/research-autonomy.php
          test -f package-website/api/research-autonomy.php
          test -f package-website/worker/research-autonomy-worker.php
          test -f package-website/database/migrations/20260923_054_continuous_research_monitoring.sql
          test -f package-website/docs/phase-56-continuous-research-monitoring.md
          test -f package-website/app/research-monitoring.php
          test -f package-website/api/research-monitoring.php
          test -f package-website/worker/research-monitor-worker.php
          test -f package-website/research-monitoring.php
          test -f package-website/database/migrations/20260923_055_research_tasks_plans_deliverables.sql
          test -f package-website/docs/phase-57-research-tasks-plans-deliverables.md
          test -f package-website/app/research-tasks.php
          test -f package-website/api/research-tasks.php
          test -f package-website/worker/research-task-worker.php
          test -f package-website/research-tasks.php
          test -f package-website/database/migrations/20260923_056_research_programs_recurring_intelligence.sql
          test -f package-website/docs/phase-58-research-programs-recurring-intelligence.md
          test -f package-website/app/research-programs.php
          test -f package-website/api/research-programs.php
          test -f package-website/worker/research-program-worker.php
          test -f package-website/research-programs.php
          test -f package-website/app/research-agent-workspace.php
          test -f package-website/app/research-agent-workspace-ui.php
          test -f package-website/api/research-workspace-objects.php
          test -f package-website/assets/js/research-agent-workspace-ui.js
          test -f package-website/app/research-agents.php
          test -f package-website/api/research-agents.php
          test -f package-website/assets/js/research-agent-shell.js
          test -f package-website/admin/model-campaigns.php
          test -f package-website/admin/intelligence-release-audit.php
          test -f package-website/docs/phase-48-end-to-end-closed-loop-release-hardening.md
          test -f package-website/docs/phase-49-release-candidate-operational-hardening.md
          test -f package-website/app/release-operations.php
          test -f package-website/bin/release-backup.php
          test -f package-website/bin/release-backup-verify.php
          test -f package-website/bin/release-restore-plan.php
          test -f package-website/RELEASE-MANIFEST.json
          test -f package-website/extension/manifest.json
          test -f package-website/chrome-extension.php
          test -f package-website/downloads/Annotated-Chrome-Extension.zip

      - name: Smoke test release packages
        shell: bash
        run: |
          set -euo pipefail
          bash tests/ci/package-smoke.sh Annotated-Website.zip Annotated-Chrome-Extension.zip

      - name: Build metadata and checksums
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "validated_commit=$GITHUB_SHA"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_run_attempt=$GITHUB_RUN_ATTEMPT"
            php -r '$m=json_decode(file_get_contents("package-website/RELEASE-MANIFEST.json"),true,512,JSON_THROW_ON_ERROR); echo "release=".($m["release"]??"").PHP_EOL."release_version=".($m["version"]??"").PHP_EOL."release_phase=".($m["phase"]??"").PHP_EOL."package_fingerprint=".($m["package_fingerprint"]??"").PHP_EOL;'
          } > BUILD-METADATA.txt
          sha256sum Annotated-Website.zip Annotated-Chrome-Extension.zip > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: annotated-website
          path: Annotated-Website.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: annotated-chrome-extension
          path: Annotated-Chrome-Extension.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: annotated-package-checksums
          path: |
            SHA256SUMS.txt
            BUILD-METADATA.txt
          if-no-files-found: error
